name: caQtDM Windows Package Build

on:
  workflow_dispatch:
  pull_request:
  schedule: # Daily at 2am
    - cron: '0 2 * * *'

env:
  QT_VERSION: '6.10.0'
  QT_MODULES: 'qtserialbus qtpositioning'

  DEPS_INSTALL_ROOT: C:\deps

  QWT_INSTALL_DIR: C:\deps\qwt
  ZEROMQ_INSTALL_DIR: C:\deps\zeromq
  EPICS_BASE_DIR: C:\deps\epics-base
  CAQTDM_DIR: ${{ github.workspace }}\caqtdm

jobs:
  build:
    name: Build windows package
    runs-on: ${{ matrix.windows-version}}
    strategy:
      fail-fast: false
      matrix:
        windows-version: ['windows-2025', 'windows-2022']
        
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: caqtdm

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          host: windows
          target: desktop
          set-env: true
          cache: true

      - name: Download jom
        run: |
          curl -L -o jom.zip https://download.qt.io/official_releases/jom/jom_1_1_4.zip
          tar -xf jom.zip -C C:\jom
          dir C:\jom
          echo "::add-path::C:\jom"

      - name: Verify JOM installation
        run: |
          jom.exe --version || echo "Error: JOM not found or not in PATH"

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64
      
      - name: Create dependencies install directory
        run: mkdir ${{ env.DEPS_INSTALL_ROOT }}

      - name: Clone Qwt
        run: git clone https://git.code.sf.net/p/qwt/git --single-branch --branch qwt-6.3 qwt-src
        working-directory: ${{ github.workspace }}

      - name: Configure, Build and Install Qwt
        working-directory: ${{ github.workspace }}/qwt-src
        run: |
          powershell -Command "(Get-Content qwtconfig.pri) -replace '^QWT_INSTALL_PREFIX.*$', 'QWT_INSTALL_PREFIX = ${{ env.QWT_INSTALL_DIR }}' | Set-Content qwtconfig.pri"
          qmake qwt.pro
          jom.exe -j%NUMBER_OF_PROCESSORS%
          jom.exe install
          echo "QWT_INSTALL_DIR=${{ env.QWT_INSTALL_DIR }}" >> %GITHUB_ENV%

      - name: Clone ZeroMQ
        run: git clone https://github.com/zeromq/libzmq.git --single-branch --branch zeromq4-x libzmq-src
        working-directory: ${{ github.workspace }}

      - name: Build and Install ZeroMQ
        working-directory: $${ github.workspace }/libzmq-src
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.ZEROMQ_INSTALL_DIR }} `
                   -DZMQ_BUILD_PROGRAMS=OFF -DZMQ_BUILD_TESTS=OFF `
                   -DCMAKE_GENERATOR_PLATFORM=x64
          cmake --build . --config Release
          cmake --install . --config Release
          echo "ZEROMQ_INSTALL_DIR=${{ env.ZEROMQ_INSTALL_DIR }}" >> %GITHUB_ENV%
      
      - name: Clone EPICS Base
        run: |
          git clone https://github.com/epics-base/epics-base.git .
          git checkout R7.0.9
        working-directory: ${{ env.EPICS_BASE_DIR }}

      - name: Configure and Build EPICS Base
        working-directory: ${{ env.EPICS_BASE_DIR }}
        run: |
          echo "T_A = windows-x64" > configure\CONFIG_SITE.local
          set EPICS_HOST_ARCH=windows-x64
          make -s -j%NUMBER_OF_PROCESSORS%
          echo "EPICS_BASE=%cd%" >> %GITHUB_ENV%
          echo "EPICS_HOST_ARCH=windows-x64" >> %GITHUB_ENV%

      - name: Set caQtDM build environment variables
        run: |
          echo "QTHOME=${{ env.QT_ROOT_DIR }}" >> %GITHUB_ENV%
          echo "QWTHOME=${{ env.QWT_INSTALL_DIR }}" >> %GITHUB_ENV%
          echo "QWTINCLUDE=${{ env.QWT_INSTALL_DIR }}\include" >> %GITHUB_ENV%
          echo "QWTLIB=${{ env.QWT_INSTALL_DIR }}\lib" >> %GITHUB_ENV%
          echo "QWTVERSION=6.1" >> %GITHUB_ENV%
          echo "QWTLIBNAME=qwt" >> %GITHUB_ENV%
          echo "CAQTDMVER=QT6" >> %GITHUB_ENV%
          echo "ZMQ=${{ env.ZEROMQ_INSTALL_DIR }}" >> %GITHUB_ENV%
          echo "ZMQINC=${{ env.ZEROMQ_INSTALL_DIR }}\include" >> %GITHUB_ENV%
          echo "ZMQLIB=${{ env.ZEROMQ_INSTALL_DIR }}\lib" >> %GITHUB_ENV%
          echo "EPICSINCLUDE=${{ env.EPICS_BASE }}\include" >> %GITHUB_ENV%
          echo "QTCONTROLS_LIBS=${{ env.CAQTDM_DIR}}\caQtDM_Binaries" >> %GITHUB_ENV%
          echo "CAQTDM_COLLECT=${{ env.CAQTDM_DIR }}\caQtDM_Binaries" >> %GITHUB_ENV%
          echo "QTBASE=${{ env.CAQTDM_DIR }}\caQtDM_Binaries" >> %GITHUB_ENV%
          echo "QMAKESPEC=${{ env.QT_ROOT_DIR }}\mkspecs\win32-msvc" >> %GITHUB_ENV%
          echo "TIMESTAMPER=http://timestamp.digicert.com" >> %GITHUB_ENV%
          echo "CAQTDM_SIGNER=Paul Scherrer Institut" >> %GITHUB_ENV%
          echo "CAQTDM_GPS=1" >> %GITHUB_ENV%
          echo "CAQTDM_MODBUS=1" >> %GITHUB_ENV%

      - name: Configure and Build caQtDM
        working-directory: ${{ env.CAQTDM_DIR }}
        run: |
          set /a timerstart=(((1%time:~0,2%-100)*60*60)+((1%time:~3,2%-100)*60)+(1%time:~6,2%-100)^)
          qmake all.pro
          jom.exe -j%NUMBER_OF_PROCESSORS% release
          set /a timerstop=(((1%time:~0,2%-100)*60*60)+((1%time:~3,2%-100)*60)+(1%time:~6,2%-100)^)
          set /a timeseks=(%timerstop%-%timerstart%)
          set /a timemins=(%timerstop%-%timerstart%)/60
          echo caQtDM compile time seconds: %timeseks% -- minutes: %timemins%

      - name: Install WiX Toolset via Chocolatey
        run: choco install wixtoolset -y

      - name: Create caQtDM Windows package
        working-directory: ${{ env.CAQTDM_DIR }}\caQtDM_Viewer\package\windows
        run: |
          mkdir project_x64
          cd project_x64
          candle ../caQtDM_x64.wxs -ext WixUIExtension -ext WixUtilExtension
          light caQtDM_x64.wixobj -ext WixUIExtension -ext WixUtilExtension
          copy caQtDM_x64.msi ${{ github.workspace }}\caQtDM_x64.msi

      - name: Upload caQtDM Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: caQtDM_x64_${{ matrix.windows-version }}
          path: ${{ github.workspace }}\caQtDM_x64.msi
