name: caQtDM Windows Package Build

on:
  workflow_dispatch:
  pull_request:
  schedule: # Daily at 2am
    - cron: '0 2 * * *'

env:
  QT_VERSION: '6.10.0'
  QT_MODULES: 'qtserialbus qtpositioning qt5compat qtserialport'

  QWT_VERSION: '6.3'
  ZEROMQ_VERSION: '4.3.5'
  EPICS_VERSION: 'R7.0.9'

  DEPS_INSTALL_ROOT: C:\deps

  QWT_INSTALL_DIR: C:\deps\qwt
  ZEROMQ_INSTALL_DIR: C:\deps\zeromq
  EPICS_BASE_DIR: C:\deps\epics-base
  CAQTDM_DIR: ${{ github.workspace }}\caqtdm

jobs:
  build:
    name: Build windows package
    runs-on: ${{ matrix.windows-version }}
    strategy:
      fail-fast: false
      matrix:
        windows-version: ['windows-2022', 'windows-2025']
        
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: caqtdm

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          host: windows
          target: desktop
          set-env: true
          cache: true

      - name: Cache Qwt
        id: cache-qwt
        uses: actions/cache@v4
        with:
          path: ${{ env.QWT_INSTALL_DIR }}
          key: qwt-${{ env.QWT_VERSION }}-qt${{ env.QT_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            qwt-${{ env.QWT_VERSION }}-qt${{ env.QT_VERSION }}-${{ runner.os }}-

      - name: Cache ZeroMQ
        id: cache-zeromq
        uses: actions/cache@v4
        with:
          path: ${{ env.ZEROMQ_INSTALL_DIR }}
          key: zeromq-${{ env.ZEROMQ_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            zeromq-${{ env.ZEROMQ_VERSION }}-${{ runner.os }}-

      - name: Cache EPICS Base
        id: cache-epics
        uses: actions/cache@v4
        with:
          path: ${{ env.EPICS_BASE_DIR }}
          key: epics-${{ env.EPICS_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            epics-${{ env.EPICS_VERSION }}-${{ runner.os }}-

      - name: Cache JOM
        id: cache-jom
        uses: actions/cache@v4
        with:
          path: C:\jom
          key: jom-1.1.4-${{ runner.os }}

      - name: Download jom
        if: steps.cache-jom.outputs.cache-hit != 'true'
        run: |
          curl -L -o jom.zip https://download.qt.io/official_releases/jom/jom_1_1_4.zip
          mkdir C:\jom
          tar -xf jom.zip -C C:\jom
          dir C:\jom

      - name: Add JOM to PATH
        shell: pwsh
        run: echo "C:\jom" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify JOM installation
        run: |
          jom.exe /VERSION || echo "Error: JOM not found or not in PATH"

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64
      
      - name: Create retry function script
        shell: pwsh
        run: |
          @'
          function Invoke-WithRetry {
              param(
                  [scriptblock]$ScriptBlock,
                  [int]$MaxAttempts = 5,
                  [string]$Operation
              )
              
              for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
                  try {
                      Write-Host "Attempt $attempt of $MaxAttempts for $Operation"
                      & $ScriptBlock
                      Write-Host "$Operation succeeded on attempt $attempt"
                      return
                  }
                  catch {
                      Write-Warning "$Operation failed on attempt $attempt`: $($_.Exception.Message)"
                      if ($attempt -eq $MaxAttempts) {
                          Write-Error "$Operation failed after $MaxAttempts attempts"
                          throw
                      }
                      $delay = [math]::Pow(2, $attempt - 1) * 5
                      Write-Host "Waiting $delay seconds before retry..."
                      Start-Sleep -Seconds $delay
                  }
              }
          }
          '@ | Out-File -FilePath "${{ github.workspace }}\retry-helper.ps1" -Encoding utf8

      - name: Create dependencies install directory
        run: if not exist ${{ env.DEPS_INSTALL_ROOT }} mkdir ${{ env.DEPS_INSTALL_ROOT }}

      - name: Clone Qwt
        if: steps.cache-qwt.outputs.cache-hit != 'true'
        run: git clone https://git.code.sf.net/p/qwt/git --single-branch --branch qwt-${{ env.QWT_VERSION }} qwt-src
        working-directory: ${{ github.workspace }}

      - name: Configure, Build and Install Qwt
        if: steps.cache-qwt.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/qwt-src
        shell: pwsh
        run: |
          . "${{ github.workspace }}\retry-helper.ps1"

          (Get-Content qwtbuild.pri) -replace '^#CONFIG.*debug_and_release.*$', 'CONFIG += debug_and_release' | Set-Content qwtbuild.pri
          (Get-Content qwtbuild.pri) -replace '^#CONFIG.*build_all.*$', 'CONFIG += build_all' | Set-Content qwtbuild.pri
          (Get-Content qwtconfig.pri) -replace '^\s*QWT_INSTALL_PREFIX\s*=.*$', '    QWT_INSTALL_PREFIX = ${{ env.QWT_INSTALL_DIR }}' | Set-Content qwtconfig.pri
          
          # Disable examples, playground, and tests to reduce build time in CI
          (Get-Content qwtconfig.pri) -replace '^QWT_CONFIG\s*\+=\s*QwtExamples.*$', '# QWT_CONFIG += QwtExamples' | Set-Content qwtconfig.pri
          (Get-Content qwtconfig.pri) -replace '^QWT_CONFIG\s*\+=\s*QwtPlayground.*$', '# QWT_CONFIG += QwtPlayground' | Set-Content qwtconfig.pri
          (Get-Content qwtconfig.pri) -replace '^QWT_CONFIG\s*\+=\s*QwtTests.*$', '# QWT_CONFIG += QwtTests' | Set-Content qwtconfig.pri
          (Get-Content qwtconfig.pri) -replace '^QWT_CONFIG\s*\+=\s*QwtDesigner.*$', '# QWT_CONFIG += QwtDesigner' | Set-Content qwtconfig.pri
          (Get-Content qwtconfig.pri) -replace '^    QWT_CONFIG\s*\+=\s*QwtDesignerSelfContained.*$', '#     QWT_CONFIG += QwtDesignerSelfContained' | Set-Content qwtconfig.pri
          
          qmake qwt.pro

          Invoke-WithRetry -Operation "Qwt build" -ScriptBlock {
              $buildProcess = Start-Process -FilePath "jom.exe" -ArgumentList "-j$env:NUMBER_OF_PROCESSORS", "release" -Wait -PassThru -NoNewWindow
              if ($buildProcess.ExitCode -ne 0) {
                  throw "Qwt build failed with exit code $($buildProcess.ExitCode)"
              }
          }

          $installProcess = Start-Process -FilePath "jom.exe" -ArgumentList "-j$env:NUMBER_OF_PROCESSORS", "install" -Wait -PassThru -NoNewWindow
          if ($installProcess.ExitCode -ne 0) {
            throw "Qwt install failed with exit code $($installProcess.ExitCode)"
          }

      - name: Clone ZeroMQ
        if: steps.cache-zeromq.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/zeromq/libzmq.git libzmq-src
          cd libzmq-src
          git checkout v${{ env.ZEROMQ_VERSION }}
        working-directory: ${{ github.workspace }}

      - name: Build and Install ZeroMQ
        if: steps.cache-zeromq.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}\libzmq-src
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.ZEROMQ_INSTALL_DIR }} -DZMQ_BUILD_PROGRAMS=OFF -D WITH_PERF_TOOL=OFF -DZMQ_BUILD_TESTS=OFF -DCMAKE_GENERATOR_PLATFORM=x64 -DBUILD_SHARED=ON -DBUILD_STATIC=OFF
          cmake --build . --config Release
          cmake --install . --config Release

      - name: Set MSVC_SUFFIX environment variable
        shell: pwsh
        run: |
          $MSVC_SUFFIX = ""
          if ($env:VC_TOOLS_VERSION) {
            $vcToolParts = $env:VC_TOOLS_VERSION.Split('.'); if ($vcToolParts.Length -ge 2 -and $vcToolParts[0] -eq "14") {
            if ($vcToolParts[1] -eq "2") { $MSVC_SUFFIX = "v142" } elseif ($vcToolParts[1] -eq "3") { $MSVC_SUFFIX = "v143" }
            }
          }
          if (-not $MSVC_SUFFIX) {
            if ($env:VisualStudioVersion) {
            if ($env:VisualStudioVersion -like "17.*") { $MSVC_SUFFIX = "v143" } elseif ($env:VisualStudioVersion -like "16.*") { $MSVC_SUFFIX = "v142" }
            }
          }
          if (-not $MSVC_SUFFIX) {
            Write-Warning "Could not determine MSVC suffix. Defaulting to v143."; $MSVC_SUFFIX = "v143"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "MSVC_SUFFIX=$MSVC_SUFFIX"
          Write-Host "Exported MSVC_SUFFIX=$MSVC_SUFFIX to GITHUB_ENV"

      - name: Set ZeroMQ environment variables
        shell: pwsh
        run : |
          $zmqVersionUnderscore = "${{ env.ZEROMQ_VERSION }}".Replace(".", "_")
          Add-Content -Path $env:GITHUB_ENV -Value "ZMQLIBRARY=libzmq-${{ env.MSVC_SUFFIX }}-mt-$zmqVersionUnderscore.lib"
          Add-Content -Path $env:GITHUB_ENV -Value "ZMQ_LIB_NAME=libzmq-${{ env.MSVC_SUFFIX }}-mt-$zmqVersionUnderscore.lib"

      - name: Create EPICS Base directory
        if: steps.cache-epics.outputs.cache-hit != 'true'
        run: mkdir ${{ env.EPICS_BASE_DIR }}
      
      - name: Clone EPICS Base
        if: steps.cache-epics.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/epics-base/epics-base.git .
          git checkout ${{ env.EPICS_VERSION }}
        working-directory: ${{ env.EPICS_BASE_DIR }}

      - name: Configure and Build EPICS Base
        if: steps.cache-epics.outputs.cache-hit != 'true'
        working-directory: ${{ env.EPICS_BASE_DIR }}
        run: |
          echo "T_A = windows-x64" > configure\CONFIG_SITE.local
          set EPICS_HOST_ARCH=windows-x64
          make -s -j%NUMBER_OF_PROCESSORS%

      - name: Set EPICS environment variables
        run: |
          echo EPICS_BASE=${{ env.EPICS_BASE_DIR }}>> %GITHUB_ENV%
          echo EPICS_HOST_ARCH=windows-x64>> %GITHUB_ENV%

      - name: Set caQtDM build environment variables
        run: |
          echo QTHOME=${{ env.QT_ROOT_DIR }}>> %GITHUB_ENV%
          echo QWTHOME=${{ env.QWT_INSTALL_DIR }}>> %GITHUB_ENV%
          echo QWTINCLUDE=${{ env.QWT_INSTALL_DIR }}\include>> %GITHUB_ENV%
          echo QWTLIB=${{ env.QWT_INSTALL_DIR }}\lib>> %GITHUB_ENV%
          echo QWTVERSION=6.1>> %GITHUB_ENV%
          echo QWTLIBNAME=qwt>> %GITHUB_ENV%
          echo CAQTDMQTVER=QT6>> %GITHUB_ENV%
          echo ZMQ=${{ env.ZEROMQ_INSTALL_DIR }}>> %GITHUB_ENV%
          echo ZMQINC=${{ env.ZEROMQ_INSTALL_DIR }}\include>> %GITHUB_ENV%
          echo ZMQLIB=${{ env.ZEROMQ_INSTALL_DIR }}\lib>> %GITHUB_ENV%
          echo ZMQ_VERSION=${{ env.ZEROMQ_VERSION }}>> %GITHUB_ENV%
          echo EPICSINCLUDE=${{ env.EPICS_BASE }}\include>> %GITHUB_ENV%
          echo QTCONTROLS_LIBS=${{ env.CAQTDM_DIR }}\caQtDM_Binaries>> %GITHUB_ENV%
          echo CAQTDM_COLLECT=${{ env.CAQTDM_DIR }}\caQtDM_Binaries>> %GITHUB_ENV%
          echo QTBASE=${{ env.CAQTDM_DIR }}\caQtDM_Binaries>> %GITHUB_ENV%
          echo QMAKESPEC=${{ env.QT_ROOT_DIR }}\mkspecs\win32-msvc>> %GITHUB_ENV%
          echo TIMESTAMPER=http://timestamp.digicert.com>> %GITHUB_ENV%
          echo CAQTDM_SIGNER=Paul Scherrer Institut>> %GITHUB_ENV%
          echo CAQTDM_GPS=1 >> %GITHUB_ENV%
          echo CAQTDM_MODBUS=1 >> %GITHUB_ENV%

      - name: Configure and Build caQtDM
        working-directory: ${{ env.CAQTDM_DIR }}
        shell: pwsh
        run: |
          . "${{ github.workspace }}\retry-helper.ps1"

          $timerstart = Get-Date
          qmake all.pro
          
          Invoke-WithRetry -Operation "caQtDM build" -ScriptBlock {
              $process = Start-Process -FilePath "jom.exe" -ArgumentList "-j$env:NUMBER_OF_PROCESSORS", "release" -Wait -PassThru -NoNewWindow
              if ($process.ExitCode -ne 0) {
                  throw "Build failed with exit code $($process.ExitCode)"
              }
          }
          
          $timerstop = Get-Date
          $elapsed = $timerstop - $timerstart
          Write-Host "caQtDM compile time: $($elapsed.TotalSeconds) seconds -- $($elapsed.TotalMinutes) minutes"

      - name: Create caQtDM Windows package
        working-directory: ${{ env.CAQTDM_DIR }}\caQtDM_Viewer\package\windows
        run: |
          mkdir project_x64
          cd project_x64
          candle ..\caQtDM_x64.wxs -ext WixUIExtension -ext WixUtilExtension
          light caQtDM_x64.wixobj -ext WixUIExtension -ext WixUtilExtension
          copy caQtDM_x64.msi ${{ github.workspace }}\caQtDM_x64.msi

      - name: Upload caQtDM Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: caQtDM_x64_${{ matrix.windows-version }}
          path: ${{ github.workspace }}\caQtDM_x64.msi
