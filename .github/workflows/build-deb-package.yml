name: caQtDM DEB Package Build

on:
  workflow_dispatch:
  pull_request:
  schedule: # Daily at 2am
    - cron: '0 2 * * *'

jobs:
  build:
    name: Build DEB package
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential devscripts dh-make debhelper

    - name: Install dependencies
      run: |
        sudo apt-get install -y \
          libncurses-dev libreadline-dev \
          qtbase5-dev qt5-qmake libqwt-qt5-dev python3-dev qttools5-dev qttools5-dev libqt5svg5-dev libqt5designer5 libqt5svg5 libqt5x11extras5-dev libzmq3-dev libqt5serialbus5-dev qtpositioning5-dev
    
    - name: Build and install epics-base
      run: |
        cd caQtDM_Viewer/package/debian/epics-base
        ./create-deb.sh
        sudo dpkg -i *.deb

    - name: Build DEB package
      run: |
        cd caQtDM_Viewer/package/debian/caqtdm
        ./create-deb.sh
        ls -l *.deb

    - name: Install DEB package
      run: |
        cd caQtDM_Viewer/package/debian/caqtdm
        sudo dpkg -i *.deb

    - name: Upload epics-base package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: epics-base_deb-package
        path: caQtDM_Viewer/package/debian/epics-base/*.deb

    - name: Upload DEB package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: caqtdm_deb-package
        path: caQtDM_Viewer/package/debian/caqtdm/*.deb

    - name: Verify caQtDM installation
      run: |
        which caQtDM
        caQtDM -help