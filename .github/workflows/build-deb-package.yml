name: caQtDM DEB Package Build

on:
  workflow_dispatch:
  pull_request:
  schedule: # Daily at 2am
    - cron: '0 2 * * *'

jobs:
  build:
    name: Build DEB package
    runs-on: ${{ matrix.ubuntu-version }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: [ubuntu-22.04, ubuntu-24.04]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential devscripts dh-make debhelper

    - name: Install dependencies
      run: |
        sudo apt-get install -y \
          libssl-dev libmbedtls-dev \
          libncurses-dev libreadline-dev \
          qtbase5-dev qtbase5-private-dev qt5-qmake libqwt-qt5-dev python3-dev qttools5-dev qttools5-dev libqt5svg5-dev libqt5designer5 libqt5svg5 libqt5x11extras5-dev libzmq3-dev libqt5serialbus5-dev qtpositioning5-dev
    
    - name: Build and install Qt OPC UA
      run: |
        set -e

        QTOPCUA_SRC="$GITHUB_WORKSPACE/qtopcua-src"
        rm -rf "$QTOPCUA_SRC"

        git clone https://code.qt.io/qt/qtopcua.git "$QTOPCUA_SRC"
        cd "$QTOPCUA_SRC"
        git checkout v5.15.2

        # Workaround for conflicting compiler flags created with qmake from qtbase5-dev
        sed -i 's/-Wno-format//g' src/3rdparty/open62541.pri

        mkdir build
        cd build

        qmake ..
        make -j$(nproc)

        sudo make install

    - name: Build and install epics-base
      run: |
        cd caQtDM_Viewer/package/debian/epics-base
        chmod +x ./create-deb.sh
        ./create-deb.sh
        sudo dpkg -i *.deb

    - name: Build DEB package
      run: |
        cd caQtDM_Viewer/package/debian/caqtdm_qt5
        chmod +x ./create-deb.sh
        ./create-deb.sh --no-checkout
        ls -l *.deb

    - name: Install DEB package
      run: |
        cd caQtDM_Viewer/package/debian/caqtdm_qt5
        sudo dpkg -i *.deb

    - name: Upload epics-base package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: epics-base_deb-package-${{ matrix.ubuntu-version }}
        path: caQtDM_Viewer/package/debian/epics-base/*.deb

    - name: Upload DEB package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: caqtdm_deb-package-${{ matrix.ubuntu-version }}
        path: caQtDM_Viewer/package/debian/caqtdm_qt5/*.deb

    - name: Verify caQtDM installation
      run: |
        which caQtDM