name: caQtDM DEB Package Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'caQtDM_docs/**'
      - 'caQtDM_Tests/**'
  schedule: # Daily at 2am
    - cron: '0 2 * * *'

jobs:
  build:
    name: Build DEB package
    runs-on: ubuntu-latest
    container: ${{ matrix.container-image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container-image: debian:12
            artifact_name: debian-12
            qt-version: "5"
          - container-image: ubuntu:22.04
            artifact_name: ubuntu-22.04
            qt-version: "5"
          - container-image: ubuntu:24.04
            artifact_name: ubuntu-24.04
            qt-version: "5"
          - container-image: debian:13
            artifact_name: debian-13
            qt-version: "6"
          - container-image: ubuntu:26.04
            artifact_name: ubuntu-26.04
            qt-version: "6"

    permissions:
      contents: read
      actions: write

    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Europe/Zurich

    steps:
    - name: Set up build environment
      run: |
        apt-get update
        apt-get install -y git build-essential devscripts dh-make debhelper
        useradd --comment "caQtDM package builder" --create-home --shell /bin/bash builder

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Prepare unprivileged package build
      run: |
        chown -R builder:builder "$GITHUB_WORKSPACE"
    
    - name: Install Qt 5 dependencies
      if: matrix.qt-version == '5'
      run: |
        apt-get install -y \
          libssl-dev libmbedtls-dev \
          libncurses-dev libreadline-dev \
          qtbase5-dev qtbase5-private-dev qt5-qmake libqwt-qt5-dev python3-dev qttools5-dev qttools5-dev libqt5svg5-dev libqt5designer5 libqt5svg5 libqt5x11extras5-dev libzmq3-dev libqt5serialbus5-dev qtpositioning5-dev libqt5positioning5-plugins libqt5location5

    - name: Install Qt 6 dependencies
      if: matrix.qt-version == '6'
      run: |
        apt-get install -y \
          libssl-dev libmbedtls-dev \
          libncurses-dev libreadline-dev \
          qt6-base-dev qt6-tools-dev qt6-svg-dev qt6-positioning-dev qt6-serialbus-dev qt6-5compat-dev libqwt-qt6-dev python3-dev libzmq3-dev
    
    - name: Build and install Qt OPC UA DEB
      if: matrix.qt-version == '5'
      run: |
        set -e
        cd caQtDM_Viewer/package/debian/qtopcua
        runuser -u builder -- ./create-deb.sh
        dpkg -i *.deb

    - name: Build and install epics-base
      run: |
        cd caQtDM_Viewer/package/debian/epics-base
        runuser -u builder -- ./create-deb.sh
        dpkg -i *.deb

    - name: Build DEB package
      run: |
        cd caQtDM_Viewer/package/debian/caqtdm_qt${{ matrix.qt-version }}
        runuser -u builder -- ./create-deb.sh --no-checkout --no-parent-orig
        ls -l *.deb

    - name: Install DEB package
      run: |
        cd caQtDM_Viewer/package/debian/caqtdm_qt${{ matrix.qt-version }}
        dpkg -i *.deb

    - name: Name DEB files by build target
      shell: bash
      run: |
        find caQtDM_Viewer/package/debian -maxdepth 2 -type f -name '*.deb' -print0 | while IFS= read -r -d '' package; do
          mv "$package" "${package%.deb}_qt${{ matrix.qt-version }}_${{ matrix.artifact_name }}.deb"
        done

    - name: Upload Qt OPC UA package as artifact
      if: matrix.qt-version == '5'
      uses: actions/upload-artifact@v7
      with:
        name: qtopcua_deb-package-${{ matrix.artifact_name }}
        path: caQtDM_Viewer/package/debian/qtopcua/*.deb

    - name: Upload epics-base package as artifact
      uses: actions/upload-artifact@v7
      with:
        name: epics-base_deb-package-${{ matrix.artifact_name }}
        path: caQtDM_Viewer/package/debian/epics-base/*.deb

    - name: Upload DEB package as artifact
      uses: actions/upload-artifact@v7
      with:
        name: caqtdm_deb-package-qt${{ matrix.qt-version }}-${{ matrix.artifact_name }}
        path: caQtDM_Viewer/package/debian/caqtdm_qt${{ matrix.qt-version }}/*.deb

    - name: Verify caQtDM installation
      run: |
        which caQtDM
