name: caQtDM RPM Package Build

on:
  workflow_dispatch:
  pull_request:
  schedule: # Daily at 2am
    - cron: '0 2 * * *'

jobs:
  build:
    name: Build RPM package
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    env:
      QWT_VER: 6.3.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:44
            rhel_major: 0
          - image: almalinux:10.0
            rhel_major: 10
          - image: rockylinux:9
            rhel_major: 9

    steps:
    - name: Install Node.js
      run: |
        dnf install -y nodejs

    - name: Install git
      run: |
        dnf install -y git

    - name: Prepare EPEL repository
      if: ${{ matrix.rhel_major > 0 }}
      run: |
        set -euo pipefail
        dnf install -y dnf-plugins-core || true
        dnf config-manager --set-enabled crb || true
        # Install EPEL release package matching the major version (e.g., 10, 11)
        dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-${{ matrix.rhel_major }}.noarch.rpm || true
        # Ensure EPEL repo is enabled
        dnf config-manager --set-enabled epel || true

    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Restore Qwt RPM cache
      if: ${{ matrix.rhel_major >= 10 }}
      id: qwt-cache
      uses: actions/cache@v4
      with:
        path: $HOME/rpmbuild/RPMS
        key: qwt-rpm-${{ matrix.image }}-${{ env.QWT_VER }}-${{ runner.os }}
        restore-keys: |
          qwt-rpm-${{ matrix.image }}-${{ env.QWT_VER }}-

    - name: Install Qwt build dependencies (only if cache miss)
      if: ${{ matrix.rhel_major >= 10 && steps.qwt-cache.outputs.cache-hit != 'true' }}
      run: |
        set -euo pipefail
        dnf install -y \
          qt6-qtbase-devel qt6-qttools-devel qt6-qtsvg-devel \
          cmake gcc-c++ make autoconf automake libtool pkgconfig \
          bzip2 rpmdevtools

    - name: Build Qwt RPM (only if cache miss)
      if: ${{ matrix.rhel_major >= 10 && steps.qwt-cache.outputs.cache-hit != 'true' }}
      run: |
        set -euo pipefail
        mkdir -p $HOME/rpmbuild/RPMS
        chmod +x .github/workflows/scripts/build-qwt-rpm.sh
        .github/workflows/scripts/build-qwt-rpm.sh

    - name: Install qwt RPM (RHEL >=10)
      if: ${{ matrix.rhel_major >= 10 }}
      run: |
        rpm -ivh $HOME/rpmbuild/RPMS/*/qwt-qt6-*.rpm

    - name: Install build dependencies for epics-base
      run: |
        dnf install -y \
          gcc make patch perl libedit-devel ncurses-devel \
          wget rpmdevtools git

    - name: Build epics-base RPM
      run: |
        cd caQtDM_Viewer/package/redhat/epics-base

        # Create the RPM build environment
        rpmdev-setuptree

        # Download source
        wget https://epics-controls.org/download/base/base-7.0.9.tar.gz
        wget https://epics-controls.org/download/base/base-7.0.9.tar.gz.asc

        # Copy source and patches to rpmbuild directories
        cp base-7.0.9.tar.gz ~/rpmbuild/SOURCES/
        cp base-7.0.9.tar.gz.asc ~/rpmbuild/SOURCES/
        cp *.patch ~/rpmbuild/SOURCES/
        cp epics-base.spec ~/rpmbuild/SPECS/

        cd ~/rpmbuild/SPECS
        # Patch epics-base.spec to replace readline-devel dependency with libedit-devel
        sed -i 's/readline-devel/libedit-devel/g' epics-base.spec
        
        # Build the RPM package
        rpmbuild -ba epics-base.spec

    - name: Install epics-base RPM
      run: |
        rpm -ivh ~/rpmbuild/RPMS/*/epics-base-7.0.9-*.rpm

    - name: Install caQtDM build dependencies (RHEL <10, non-Fedora — use Qt5)
      if: ${{ matrix.rhel_major < 10 && !contains(matrix.image, 'fedora') }}
      run: |
        set -euo pipefail
        dnf install -y \
          qt5-qtbase-devel qt5-qttools-devel qt5-qtsvg-devel \
          qt5-qtserialbus-devel qt5-qtlocation-devel \
          libXext-devel python3-devel zeromq-devel \
          cmake gcc-c++ make autoconf automake libtool pkgconfig \
          curl tar jansson-devel libuuid-devel libsodium-devel \
          qwt-qt5-devel czmq-devel cppzmq-devel qt5-qttools-devel

    - name: Install caQtDM build dependencies (Fedora — keep Qt6)
      if: ${{ contains(matrix.image, 'fedora') }}
      run: |
        set -euo pipefail
        dnf install -y \
          qt6-qtbase-devel qt6-qttools-devel qt6-qtsvg-devel \
          qt6-qtserialbus-devel qt6-qt5compat-devel qt6-qtlocation-devel \
          libXext-devel python3-devel zeromq-devel \
          cmake gcc-c++ make autoconf automake libtool pkgconfig \
          curl tar jansson-devel libuuid-devel libsodium-devel \
          qwt-qt6-devel czmq-devel cppzmq-devel qt6-qttools-devel

    - name: Install caQtDM build dependencies (RHEL >=10)
      if: ${{ matrix.rhel_major >= 10 }}
      run: |
        set -euo pipefail
        # Install the core pieces available in AlmaLinux/EPEL; the Alma-only script will build the rest
        dnf install -y \
          qt6-qtbase-devel qt6-qttools-devel qt6-qtsvg-devel \
          qt6-qtserialbus-devel qt6-qt5compat-devel qt6-qtlocation-devel \
          libXext-devel python3-devel zeromq-devel \
          cmake gcc-c++ make autoconf automake libtool pkgconfig \
          curl tar jansson-devel libuuid-devel libsodium-devel qt6-qttools-devel

    - name: Prepare RHEL >=10 install script
      if: ${{ matrix.rhel_major >= 10 }}
      run: |
        set -euo pipefail
        mkdir -p $HOME/rpmbuild/RPMS
        chmod +x .github/workflows/scripts/install-alma-extra-deps.sh

    - name: Install RHEL >=10-only dependencies
      if: ${{ matrix.rhel_major >= 10 }}
      run: |
        set -euo pipefail
        # Install dependencies required on RHEL-derivatives >=10 (EPEL packages or builds)
        .github/workflows/scripts/install-alma-extra-deps.sh

    - name: Build caQtDM RPM
      run: |
        cd caQtDM_Viewer/package/redhat/caqtdm

        # Set EPICS_BASE environment variable
        export EPICS_BASE_TARGET=/usr/local/epics/base-7.0.9

        # The create-rpm.sh script will handle the rest
        chmod +x create-rpm.sh
        ./create-rpm.sh --no-checkout

    - name: Upload epics-base RPM as artifact
      uses: actions/upload-artifact@v4
      with:
        name: epics-base-rpm-${{ matrix.image }}
        path: ~/rpmbuild/RPMS/*/*.rpm

    - name: Upload caQtDM RPM as artifact
      uses: actions/upload-artifact@v4
      with:
        name: caqtdm-rpm-${{ matrix.image }}
        path: ~/rpmbuild/RPMS/*/*.rpm

    - name: Verify caQtDM installation
      run: |
        rpm -ivh ~/rpmbuild/RPMS/*/caqtdm*.rpm
        which caQtDM || echo "caQtDM not in PATH, checking /opt/caqtdm"
        ls -la /opt/caqtdm/bin/ || true
