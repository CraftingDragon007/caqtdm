name: caQtDM RPM Package Build

on:
  workflow_dispatch:
  pull_request:
  schedule: # Daily at 2am
    - cron: '0 2 * * *'

jobs:
  build-qwt-rpm:
    name: Build Qwt RPM (artifact)
    runs-on: ubuntu-latest
    container:
      image: almalinux:10.0
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Prepare system and enable EPEL
      run: |
        set -euo pipefail
        dnf install -y dnf-plugins-core || true
        dnf config-manager --set-enabled crb || true
        dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm || true
        dnf install -y almalinux-release-devel || true
        dnf repolist --enabled

    - name: Install Qwt build dependencies
      run: |
        set -euo pipefail
        dnf install -y rpmdevtools gcc-c++ make cmake wget git pkgconfig qt6-qtbase-devel qt6-qtsvg-devel qt6-qttools-devel || true

    - name: Build Qwt RPM
      run: |
        set -euo pipefail
        chmod +x .github/workflows/scripts/build-qwt-rpm.sh
        export QWT_VER=6.3.0
        .github/workflows/scripts/build-qwt-rpm.sh

    - name: Upload Qwt RPM artifact
      uses: actions/upload-artifact@v4
      with:
        name: qwt-rpm
        path: $HOME/rpmbuild/RPMS/*/qwt*.rpm

  build:
    name: Build RPM package
    needs: build-qwt-rpm
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.linux-version }}
    strategy:
      fail-fast: false
      matrix:
        linux-version:
          - fedora:44
          - rockylinux:9
          - almalinux:10.0

    steps:
    - name: Determine package manager
      id: pkg-manager
      run: |
        if [ -f /etc/dnf/dnf.conf ]; then
          echo "cmd=dnf install -y" >> $GITHUB_OUTPUT
        elif [ -f /etc/yum.conf ]; then
          echo "cmd=yum install -y" >> $GITHUB_OUTPUT
        else
          echo "Unsupported package manager"
          exit 1
        fi

    - name: Prepare AlmaLinux repositories
      if: contains(matrix.linux-version, 'almalinux')
      run: |
        set -euo pipefail
        dnf install -y dnf-plugins-core || true
        dnf config-manager --set-enabled crb || true
        dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm || true
        dnf install -y almalinux-release-devel || true

    - name: Install build dependencies for epics-base
      run: |
        ${{ steps.pkg-manager.outputs.cmd }} \
          gcc make patch perl libedit-devel ncurses-devel \
          wget rpmdevtools git

    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Build epics-base RPM
      run: |
        cd caQtDM_Viewer/package/redhat/epics-base

        # Create the RPM build environment
        rpmdev-setuptree

        # Download source
        wget https://epics-controls.org/download/base/base-7.0.9.tar.gz
        wget https://epics-controls.org/download/base/base-7.0.9.tar.gz.asc

        # Copy source and patches to rpmbuild directories
        cp base-7.0.9.tar.gz ~/rpmbuild/SOURCES/
        cp base-7.0.9.tar.gz.asc ~/rpmbuild/SOURCES/
        cp *.patch ~/rpmbuild/SOURCES/
        cp epics-base.spec ~/rpmbuild/SPECS/

        cd ~/rpmbuild/SPECS
        # Patch epics-base.spec to replace readline-devel dependency with libedit-devel
        sed -i 's/readline-devel/libedit-devel/g' epics-base.spec
        
        # Build the RPM package
        rpmbuild -ba epics-base.spec

    - name: Install epics-base RPM
      run: |
        rpm -ivh ~/rpmbuild/RPMS/*/epics-base-7.0.9-*.rpm

    - name: Install caQtDM build dependencies (Fedora/Rocky)
      if: ${{ !contains(matrix.linux-version, 'almalinux') }}
      run: |
        set -euo pipefail
        ${{ steps.pkg-manager.outputs.cmd }} \
          qt6-qtbase-devel qt6-qttools-devel qt6-qtsvg-devel \
          qt6-qtserialbus-devel qt6-qt5compat-devel qt6-qtlocation-devel \
          libXext-devel python3-devel zeromq-devel \
          cmake gcc-c++ make autoconf automake libtool pkgconfig \
          curl tar jansson-devel libuuid-devel libsodium-devel \
          qwt-qt6-devel czmq-devel cppzmq-devel qt6-qttools-devel

    - name: Install caQtDM build dependencies (AlmaLinux)
      if: ${{ contains(matrix.linux-version, 'almalinux') }}
      env:
        PKG_INSTALL_CMD: ${{ steps.pkg-manager.outputs.cmd }}
      run: |
        set -euo pipefail
        # Install the core pieces available in AlmaLinux/EPEL; the Alma-only script will build the rest
        $PKG_INSTALL_CMD \
          qt6-qtbase-devel qt6-qttools-devel qt6-qtsvg-devel \
          qt6-qtserialbus-devel qt6-qt5compat-devel qt6-qtlocation-devel \
          libXext-devel python3-devel zeromq-devel \
          cmake gcc-c++ make autoconf automake libtool pkgconfig \
          curl tar jansson-devel libuuid-devel libsodium-devel qt6-qttools-devel

    - name: Download Qwt RPM artifact
      if: contains(matrix.linux-version, 'almalinux')
      uses: actions/download-artifact@v4
      with:
        name: qwt-rpm
        path: ${{ runner.temp }}/rpms

    - name: Prepare Alma install script
      if: contains(matrix.linux-version, 'almalinux')
      run: |
        set -euo pipefail
        mkdir -p $HOME/rpmbuild/RPMS
        # Move downloaded RPMs into rpmbuild layout so the install script can find them
        if [ -d "$RUNNER_TEMP/rpms" ]; then
          mv "$RUNNER_TEMP/rpms"/* "$HOME/rpmbuild/RPMS/" 2>/dev/null || true
        fi
        chmod +x .github/workflows/scripts/install-alma-extra-deps.sh

    - name: Install Alma-only dependencies
      if: contains(matrix.linux-version, 'almalinux')
      env:
        PKG_INSTALL_CMD: ${{ steps.pkg-manager.outputs.cmd }}
      run: |
        set -euo pipefail
        # Install the Alma-only dependencies (this script will try EPEL installs first,
        # fall back to source builds, and will install the Qwt RPM created in the separate job)
        .github/workflows/scripts/install-alma-extra-deps.sh

    - name: Build caQtDM RPM
      run: |
        cd caQtDM_Viewer/package/redhat/caqtdm

        # Set EPICS_BASE environment variable
        export EPICS_BASE_TARGET=/usr/local/epics/base-7.0.9

        # The create-rpm.sh script will handle the rest
        chmod +x create-rpm.sh
        ./create-rpm.sh --no-checkout

    - name: Upload epics-base RPM as artifact
      uses: actions/upload-artifact@v4
      with:
        name: epics-base-rpm-${{ matrix.linux-version }}
        path: ~/rpmbuild/RPMS/*/*.rpm

    - name: Upload caQtDM RPM as artifact
      uses: actions/upload-artifact@v4
      with:
        name: caqtdm-rpm-${{ matrix.linux-version }}
        path: ~/rpmbuild/RPMS/*/*.rpm

    - name: Verify caQtDM installation
      run: |
        rpm -ivh ~/rpmbuild/RPMS/*/caqtdm*.rpm
        which caQtDM || echo "caQtDM not in PATH, checking /opt/caqtdm"
        ls -la /opt/caqtdm/bin/ || true
