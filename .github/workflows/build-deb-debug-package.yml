name: caQtDM DEB Package Build Debug

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build DEB package
    runs-on: [self-hosted, ubuntu, debian]
    strategy:
      fail-fast: false
      matrix:
        selfrunner-version: [ubuntu, debian]

    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Detect distro
        id: detect_os
        run: |
          DISTRO=$(lsb_release -si | tr '[:upper:]' '[:lower:]')
          echo "DISTRO=$DISTRO" >> $GITHUB_ENV


    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential devscripts dh-make debhelper
    
    - name: Install dependencies
      run: |
        sudo apt-get install -y \
          libssl-dev libmbedtls-dev \
          libncurses-dev libreadline-dev \
          qtbase5-dev qtbase5-private-dev qt5-qmake libqwt-qt5-dev python3-dev qttools5-dev qttools5-dev libqt5svg5-dev libqt5designer5 libqt5svg5 libqt5x11extras5-dev libzmq3-dev libqt5serialbus5-dev qtpositioning5-dev libqt5positioning5-plugins libqt5location5
    
    - name: Build and install Qt OPC UA DEB
      run: |
        set -e
        cd caQtDM_Viewer/package/debian/qtopcua
        chmod +x ./create-deb.sh
        ./create-deb.sh
        sudo dpkg -i *.deb

    - name: Build and install epics-base
      run: |
        cd caQtDM_Viewer/package/debian/epics-base
        chmod +x ./create-deb.sh
        ./create-deb.sh
        sudo dpkg -i *.deb

    - name: Build DEB package
      run: |
        cd caQtDM_Viewer/package/debian/caqtdm_qt5
        chmod +x ./create-deb.sh
        ./create-deb.sh --no-checkout
        ls -l *.deb

    - name: Install DEB package
      run: |
        cd caQtDM_Viewer/package/debian/caqtdm_qt5
        sudo dpkg -i *.deb

    - name: Upload Qt OPC UA package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: qtopcua_deb-package-${{ env.DISTRO }}
        path: caQtDM_Viewer/package/debian/qtopcua/*.deb

    - name: Upload epics-base package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: epics-base_deb-package-${{ env.DISTRO }}
        path: caQtDM_Viewer/package/debian/epics-base/*.deb

    - name: Upload DEB package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: caqtdm_deb-package-${{ env.DISTRO }}
        path: caQtDM_Viewer/package/debian/caqtdm_qt5/*.deb

    - name: Verify caQtDM installation
      run: |
        which caQtDM
