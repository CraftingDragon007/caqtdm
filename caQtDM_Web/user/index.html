<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>caQtDM Web</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    #vnc-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
  </head>
  <body>
    <iframe
        id="vnc-container"
        src="/noVNC/vnc.html?path=&autoconnect=true&resize=scale"
        title="caQtDM"
        allowfullscreen
    ></iframe>

    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var path = params.get('path') || '0';

        var iframe = document.getElementById('vnc-container');

        function setIframeToPath(p) {
          var value = p;
          if (value == null || value === '') value = '0';
          value = String(value).trim();
          if (/^[0-9]$/.test(value)) value = '0' + value;
          if (value.startsWith('/noVNC') || value.startsWith('http')) {
            iframe.src = value;
          } else {
            iframe.src = '/noVNC/vnc.html?path=/websockify/' + encodeURIComponent(value) + '&autoconnect=true&resize=scale';
          }
        }

        setIframeToPath(path);
      })();
    </script>
  </body>
</html>
