<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>caQtDM Web</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    #menu-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: linear-gradient(180deg, #f8fafc, #e2e8f0);
      border-bottom: 1px solid #cbd5f5;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      z-index: 1050;
      font-size: 14px;
    }
    #menu-title {
      font-weight: 600;
      color: #1e293b;
    }
    #menu-bar button {
      background: transparent;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      color: #1f2937;
      font-size: 14px;
      cursor: pointer;
    }
    #menu-bar button:hover,
    #menu-bar button:focus {
      background: rgba(37, 99, 235, 0.1);
      outline: none;
    }
    #menu-bar button.has-new::after {
      content: '●';
      color: #ef4444;
      font-size: 10px;
      margin-left: 6px;
      vertical-align: middle;
    }
    #vnc-container {
      position: absolute;
      top: 32px;
      left: 0;
      width: 100%;
      height: calc(100% - 32px);
      border: none;
    }
    #dialog-overlay, #error-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1200;
    }
    #dialog-overlay.show, #error-overlay.show {
      display: flex;
    }
    #dialog-box, #error-box {
      background: #fff;
      padding: 24px;
      max-width: 320px;
      width: calc(100% - 40px);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      text-align: left;
    }
    #dialog-box p, #error-box p {
      margin: 0 0 16px 0;
      word-break: break-word;
    }
    #dialog-actions, #error-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    #dialog-actions button, #error-actions button {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      cursor: pointer;
    }
    #dialog-actions button.primary, #error-actions button.primary {
      background: #2563eb;
      border-color: #1d4ed8;
      color: #fff;
    }
    #dialog-actions button:focus, #error-actions button:focus {
      outline: 2px solid #2563eb;
      outline-offset: 1px;
    }
    #log-window {
      position: fixed;
  top: 48px;
  right: 12px;
  width: min(380px, calc(100% - 24px));
  max-height: 60vh;
      display: none;
      flex-direction: column;
      background: #fff;
      border: 1px solid #cbd5f5;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
      z-index: 1100;
  min-height: 160px;
    }
    #log-window.show {
      display: flex;
    }
    #log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      cursor: move;
      user-select: none;
    }
    #log-header span {
      font-weight: 600;
      color: #1e293b;
    }
    #log-close {
      background: transparent;
      border: none;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
    }
    #log-close:hover,
    #log-close:focus {
      background: rgba(37, 99, 235, 0.12);
      border-radius: 4px;
      outline: none;
    }
    #log-content {
      padding: 12px;
      overflow-y: auto;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      color: #1f2937;
      flex: 1;
      padding-bottom: 24px;
    }
    .log-entry {
      margin-bottom: 8px;
      word-break: break-word;
    }
    .log-entry:last-child {
      margin-bottom: 0;
    }
    .log-empty {
      margin: 0;
      color: #64748b;
      font-style: italic;
    }
    #log-window.show #log-resize-handle {
      display: block;
    }
    #log-resize-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      right: 4px;
      bottom: 4px;
      cursor: se-resize;
      border-right: 2px solid rgba(148, 163, 184, 0.8);
      border-bottom: 2px solid rgba(148, 163, 184, 0.8);
      border-radius: 2px;
      display: none;
    }
    #menu-progress {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    #progress-text {
      width: 30px;
      text-align: right;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      color: #334155;
    }
  </style>
  </head>
  <body>
    <div id="menu-bar" role="menubar">
      <span id="menu-title">caQtDM Web</span>
      <button type="button" id="menu-logs" aria-haspopup="dialog" aria-expanded="false" aria-controls="log-window">Logs</button>
      <div id="menu-progress" style="display: none;">
        <p>Loading: </p><p id="progress-text"> 1%</p><progress id="progress-bar" value="1" max="100" style="width: 120px;"></progress>
      </div>
    </div>
    <iframe
        id="vnc-container"
        src="/noVNC/vnc.html?path=&autoconnect=true&resize=scale"
        title="caQtDM"
        allowfullscreen
    ></iframe>

    <div id="log-window" role="dialog" aria-modal="false" aria-labelledby="log-title" tabindex="-1">
      <div id="log-header">
        <span id="log-title">caQtDM Web Messages</span>
        <button type="button" id="log-close" aria-label="Close logs">&times;</button>
      </div>
      <div id="log-content" data-empty="true">
        <p class="log-empty">No log messages yet.</p>
      </div>
      <div id="log-resize-handle" aria-hidden="true"></div>
    </div>

    <div id="dialog-overlay" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div id="dialog-box">
        <p id="dialog-message"></p>
        <div id="dialog-actions">
          <button type="button" id="dialog-cancel">Cancel</button>
          <button type="button" id="dialog-accept" class="primary">Open</button>
        </div>
      </div>
    </div>

    <div id="error-overlay" role="dialog" aria-modal="true" aria-labelledby="error-title">
      <div id="error-box">
        <p id="error-message"></p>
        <div id="error-actions">
          <button type="button" id="error-ok" class="primary">OK</button>
        </div>
      </div>
    </div>

    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        let path = params.get('path') || '0';
        const macros = params.get('macros') || '';

        const iframe = document.getElementById('vnc-container');
        const dialogOverlay = document.getElementById('dialog-overlay');
        const dialogMessage = document.getElementById('dialog-message');
        const dialogAccept = document.getElementById('dialog-accept');
        const dialogCancel = document.getElementById('dialog-cancel');
        let pendingOpenPath = null;
        let pendingOpenMacros = null;
        const errorOverlay = document.getElementById('error-overlay');
        const errorMessage = document.getElementById('error-message');
        const errorOk = document.getElementById('error-ok');
        const menuLogsButton = document.getElementById('menu-logs');
        const logWindow = document.getElementById('log-window');
        const logClose = document.getElementById('log-close');
        const logContent = document.getElementById('log-content');
        const logHeader = document.getElementById('log-header');
        const logResizeHandle = document.getElementById('log-resize-handle');
        let dialogTimeout = null;
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let isResizing = false;
        let resizeStartWidth = 0;
        let resizeStartHeight = 0;
        let resizeStartX = 0;
        let resizeStartY = 0;
        let logWindowManuallyPositioned = false;
        // Shared geometry constraints for the draggable/resizable log window.
        const MIN_PADDING = 12;
        const MIN_RESIZE_WIDTH = 240;
        const MIN_RESIZE_HEIGHT = 160;

        let failedOnce = false;
        let isNonNumericPath = false;
        let resolvedInstance = null;
        let newInstance = false;
        let file = null;

        let heartbeat = null;

        function openLogWindow() {
          logWindow.classList.add('show');
          menuLogsButton.classList.remove('has-new');
          menuLogsButton.setAttribute('aria-expanded', 'true');
          logWindow.focus();
          ensureLogWindowInView();
        }

        function closeLogWindow() {
          logWindow.classList.remove('show');
          menuLogsButton.setAttribute('aria-expanded', 'false');
          menuLogsButton.focus();
        }

        function toggleLogWindow() {
          if (logWindow.classList.contains('show')) {
            closeLogWindow();
          } else {
            openLogWindow();
          }
        }

        function parseLogMarkup(raw) {
          const container = document.createElement('div');
          container.innerHTML = raw;
          const fontElements = container.getElementsByTagName('font');
          while (fontElements.length) {
            const fontNode = fontElements[0];
            const span = document.createElement('span');
            const colorAttr = fontNode.getAttribute('color');
            if (colorAttr) span.style.color = colorAttr;
            while (fontNode.firstChild) {
              span.appendChild(fontNode.firstChild);
            }
            if (fontNode.parentNode) {
              fontNode.parentNode.replaceChild(span, fontNode);
            } else {
              container.appendChild(span);
            }
          }
          const fragment = document.createDocumentFragment();
          while (container.firstChild) {
            fragment.appendChild(container.firstChild);
          }
          return fragment;
        }

        function addLogMessage(html) {
          if (logContent.dataset.empty === 'true') {
            logContent.innerHTML = '';
            delete logContent.dataset.empty;
          }
          const entry = document.createElement('div');
          entry.className = 'log-entry';
          entry.appendChild(parseLogMarkup(html));
          logContent.appendChild(entry);
          logContent.scrollTop = logContent.scrollHeight;
          if (!logWindow.classList.contains('show')) {
            menuLogsButton.classList.add('has-new');
          }
        }

        menuLogsButton.addEventListener('click', toggleLogWindow);
        logClose.addEventListener('click', closeLogWindow);

        document.addEventListener('keydown', function(event) {
          if (event.key === 'Escape' && logWindow.classList.contains('show')) {
            closeLogWindow();
          }
        });

        function prepareManualPosition(rect) {
          if (logWindowManuallyPositioned) return;
          logWindow.style.left = rect.left + 'px';
          logWindow.style.top = rect.top + 'px';
          logWindow.style.right = 'auto';
          logWindow.style.maxHeight = 'none';
          logWindowManuallyPositioned = true;
          ensureLogWindowInView();
        }

        function ensureLogWindowInView() {
          if (!logWindowManuallyPositioned) return;
          const maxWidth = Math.max(0, window.innerWidth - (2 * MIN_PADDING));
          const maxHeight = Math.max(0, window.innerHeight - (2 * MIN_PADDING));
          let rect = logWindow.getBoundingClientRect();
          let width = rect.width;
          let height = rect.height;
          if (maxWidth > 0 && width > maxWidth) {
            width = maxWidth;
            logWindow.style.width = width + 'px';
          }
          if (maxHeight > 0 && height > maxHeight) {
            height = maxHeight;
            logWindow.style.height = height + 'px';
          }
          rect = logWindow.getBoundingClientRect();
          width = rect.width;
          height = rect.height;
          const maxLeft = Math.max(0, window.innerWidth - width - MIN_PADDING);
          const maxTop = Math.max(0, window.innerHeight - height - MIN_PADDING);
          const nextLeft = Math.min(Math.max(MIN_PADDING, rect.left), maxLeft);
          const nextTop = Math.min(Math.max(MIN_PADDING, rect.top), maxTop);
          logWindow.style.left = nextLeft + 'px';
          logWindow.style.top = nextTop + 'px';
          logWindow.style.right = 'auto';
        }

        function onDragStart(event) {
          if (event.button !== 0 && event.pointerType !== 'touch') return;
          if (event.target && event.target.closest('button')) return;
          let rect = logWindow.getBoundingClientRect();
          prepareManualPosition(rect);
          rect = logWindow.getBoundingClientRect();
          isDragging = true;
          dragOffsetX = event.clientX - rect.left;
          dragOffsetY = event.clientY - rect.top;
          document.addEventListener('pointermove', onDragMove);
          document.addEventListener('pointerup', onDragEnd);
          event.preventDefault();
        }

        function onDragMove(event) {
          if (!isDragging) return;
          const width = logWindow.offsetWidth;
          const height = logWindow.offsetHeight;
          let newLeft = event.clientX - dragOffsetX;
          let newTop = event.clientY - dragOffsetY;
          const maxLeft = Math.max(0, window.innerWidth - width - MIN_PADDING);
          const maxTop = Math.max(0, window.innerHeight - height - MIN_PADDING);
          newLeft = Math.min(Math.max(MIN_PADDING, newLeft), maxLeft);
          newTop = Math.min(Math.max(MIN_PADDING, newTop), maxTop);
          logWindow.style.left = newLeft + 'px';
          logWindow.style.top = newTop + 'px';
          logWindow.style.right = 'auto';
        }

        function onDragEnd() {
          if (!isDragging) return;
          isDragging = false;
          document.removeEventListener('pointermove', onDragMove);
          document.removeEventListener('pointerup', onDragEnd);
        }

        function onResizeStart(event) {
          if (event.button !== 0 && event.pointerType !== 'touch') return;
          let rect = logWindow.getBoundingClientRect();
          prepareManualPosition(rect);
          rect = logWindow.getBoundingClientRect();
          isResizing = true;
          resizeStartWidth = rect.width;
          resizeStartHeight = rect.height;
          resizeStartX = event.clientX;
          resizeStartY = event.clientY;
          document.addEventListener('pointermove', onResizeMove);
          document.addEventListener('pointerup', onResizeEnd);
          event.preventDefault();
        }

        function onResizeMove(event) {
          if (!isResizing) return;
          const deltaX = event.clientX - resizeStartX;
          const deltaY = event.clientY - resizeStartY;
          const maxWidth = Math.max(0, window.innerWidth - (2 * MIN_PADDING));
          const maxHeight = Math.max(0, window.innerHeight - (2 * MIN_PADDING));
          const minWidth = maxWidth > 0 ? Math.min(MIN_RESIZE_WIDTH, maxWidth) : 0;
          const minHeight = maxHeight > 0 ? Math.min(MIN_RESIZE_HEIGHT, maxHeight) : 0;
          const targetWidth = resizeStartWidth + deltaX;
          const targetHeight = resizeStartHeight + deltaY;
          const newWidth = Math.max(minWidth, Math.min(targetWidth, maxWidth || targetWidth));
          const newHeight = Math.max(minHeight, Math.min(targetHeight, maxHeight || targetHeight));
          logWindow.style.width = newWidth + 'px';
          logWindow.style.height = newHeight + 'px';
          ensureLogWindowInView();
        }

        function onResizeEnd() {
          if (!isResizing) return;
          isResizing = false;
          document.removeEventListener('pointermove', onResizeMove);
          document.removeEventListener('pointerup', onResizeEnd);
        }

        logHeader.addEventListener('pointerdown', onDragStart);
        logResizeHandle.addEventListener('pointerdown', onResizeStart);
        window.addEventListener('resize', ensureLogWindowInView);
        document.addEventListener('pointercancel', onDragEnd);
        document.addEventListener('pointercancel', onResizeEnd);

        function isNumericPath(value) {
          const normalized = String(value).trim();
          return /^[0-9]+$/.test(normalized);
        }

        function getInstancePath() {
          if (resolvedInstance != null) {
            return resolvedInstance;
          }
          if (path == null) return '00';
          const value = String(path).trim();
          if (value === '') return '00';
          if (!isNumericPath(value)) {
            isNonNumericPath = true;
            return '00';
          }
          return value.length === 1 ? '0' + value : value;
        }

        function setIframeToPath(p) {
          let value = p;
          if (value == null || value === '') value = '0';
          value = String(value).trim();
          if (/^[0-9]$/.test(value)) value = '0' + value;
          if (value.startsWith('/noVNC') || value.startsWith('http')) {
            iframe.src = value;
            path = value;
            return;
          }
          path = value;
          iframe.src = '/noVNC/vnc.html?path=/websockify/' + encodeURIComponent(getInstancePath()) + '&autoconnect=true&resize=scale';
        }

        setIframeToPath(path);

        let reconnectDelay = 1000;
        let reconnectTimer = null;

        function scheduleReconnect() {
          if (reconnectDelay < 0) return; //disabled
          failedOnce = true;
          if (reconnectTimer) return;
          reconnectTimer = setTimeout(function() {
            reconnectTimer = null;
            reconnectDelay = Math.min(reconnectDelay * 2, 10000);
            connectWebSocket();
          }, reconnectDelay);
        }

        function hideDialog() {
          if (dialogTimeout) {
            clearTimeout(dialogTimeout);
            dialogTimeout = null;
          }
          dialogOverlay.classList.remove('show');
          pendingOpenPath = null;
          pendingOpenMacros = null;
        }

        function showOpenFileDialog(requestedPath, macros) {
          pendingOpenPath = requestedPath;
          pendingOpenMacros = macros;
          let message = 'Open "' + requestedPath + '"?';

          if (macros && macros.trim() !== '') {
            const macroList = macros.split(';').filter(function(m) { return m.trim() !== ''; });
            if (macroList.length > 0) {
              message += '\n\nMacros:\n' + macroList.join('\n');
            }
          }

          dialogMessage.textContent = message;
          dialogOverlay.classList.add('show');
          if (dialogTimeout) clearTimeout(dialogTimeout);
          dialogTimeout = setTimeout(function() {
            hideDialog();
          }, 30000);
        }

        dialogCancel.addEventListener('click', hideDialog);

        dialogAccept.addEventListener('click', function() {
          if (!pendingOpenPath) {
            hideDialog();
            return;
          }
          const newUrl = new URL(window.location.href);
          newUrl.searchParams.set('path', pendingOpenPath);
          if (pendingOpenMacros && pendingOpenMacros.trim() !== '') {
            // Convert macros from KEY=VALUE;KEY1=VALUE1 to KEY:VALUE,KEY1:VALUE1
            const convertedMacros = pendingOpenMacros.replace(/=/g, ':').replace(/;/g, ',');
            newUrl.searchParams.set('macros', convertedMacros);
          }
          window.open(newUrl.toString(), '_blank', 'noopener');
          hideDialog();
        });

        function hideErrorDialog() {
          errorOverlay.classList.remove('show');
        }

        function showErrorDialog(message) {
          errorMessage.textContent = message;
          errorOverlay.classList.add('show');
        }

        errorOk.addEventListener('click', hideErrorDialog);

        function connectWebSocket() {
          const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
          const wsUrl = wsProtocol + window.location.host + '/instance/' + encodeURIComponent(getInstancePath());
          let socket;

          try {
            socket = new WebSocket(wsUrl);
          } catch (err) {
            console.error('WebSocket connection failed:', err);
            scheduleReconnect();
            return;
          }

          socket.onopen = function() {
            if (failedOnce && !newInstance) {
              reconnectDelay = 1000;
              failedOnce = false;
              iframe.contentWindow.location.reload();
            }
            newInstance = false;
            try {
              if (isNonNumericPath && resolvedInstance == null) {
                // Request instance number for non-numeric path
                const message = 'RESOLVE|' + path + '|' + macros;
                socket.send(message);
              } else {
                socket.send(getInstancePath());
                if (heartbeat != null) {
                  clearInterval(heartbeat);
                  heartbeat = null;
                }
                heartbeat = setInterval(function() {
                  if (socket.readyState === WebSocket.OPEN) {
                    socket.send('PING');
                  } else {
                    clearInterval(heartbeat);
                    heartbeat = null;
                  }
                }, 50000); //send a ping every 50 seconds
              }
            } catch (sendErr) {
              console.warn('WebSocket send failed:', sendErr);
            }
          };

          socket.onmessage = function(event) {
            const data = String(event.data || '');
            if (data.startsWith('LOG|')) {
              addLogMessage(data.slice(4));
              return;
            }
            if (data.startsWith('ERROR|')) {
              showErrorDialog(data.slice(6));
              return;
            }
            if (data.startsWith('PROGRESS|')) {
              const progressText = document.getElementById('progress-text');
              const progressBar = document.getElementById('progress-bar');
              const menuProgress = document.getElementById('menu-progress');
              const progress = parseInt(data.slice(9), 10);
              if (!isNaN(progress)) {
                const percent = Math.round((progress / progressBar.max) * 100);
                const digitSpace = percent < 10 ? '  ' : (percent < 100 ? ' ' : '');
                progressText.textContent = digitSpace + percent + '%';
                progressBar.value = progress;
                if (progress >= progressBar.max) {
                  setTimeout(function() {
                    menuProgress.style.display = 'none';
                  }, 5000);
                }
              } else {
                console.warn('Invalid PROGRESS value:', data.slice(9));
              }
              return;
            }
            if (data.startsWith('INIT_PROGRESS|')) {
              const progressText = document.getElementById('progress-text');
              const progressBar = document.getElementById('progress-bar');
              const menuProgress = document.getElementById('menu-progress');
              const [init, max] = data.slice(14).split('|').map(function(v) { return parseInt(v, 10); });
              if (!isNaN(init) && !isNaN(max)) {
                progressBar.max = max;
                progressBar.value = init;
                progressText.textContent = '  ' + Math.round((init / max) * 100) + '%';
                menuProgress.style.display = 'flex';
              } else {
                console.warn('Invalid INIT_PROGRESS values:', data.slice(14));
              }
              return;
            }
            if (data.startsWith('TIMEOUT|')) {
              showErrorDialog('Connection timed out: ' + data.slice(8));
              reconnectDelay = -1; //disable further reconnects
              errorOk.disabled = true;
              errorOk.style.display = 'none';
              socket.close();
              iframe.src = 'about:blank';
              return;
            }
            if (data.startsWith('INSTANCE|')) {
              let instance = data.slice(9).trim();
              if (isNonNumericPath && resolvedInstance == null) {
                instance = instance.length === 1 ? '0' + instance : instance
                resolvedInstance = instance;
                file = path;
                setIframeToPath(instance);
                socket.close();
                newInstance = true;
                // onclose will call scheduleReconnect, which will use the resolved instance
              }
              return;
            }
            const openMatchPipe = data.match(/^OPEN\|([^|]+)\|(.*)$/);
            if (openMatchPipe) {
              showOpenFileDialog(openMatchPipe[1], openMatchPipe[2]);
              return;
            }
          };

          socket.onerror = function(errorEvent) {
            console.warn('WebSocket error:', errorEvent);
            socket.close();
          };

          socket.onclose = function() {
            if (isNonNumericPath && !newInstance && file != null) {
              // ask for instance again, as the path could've changed
              resolvedInstance = null;
              path = file;
            }
            scheduleReconnect();
          };
        }

        connectWebSocket();
      })();
    </script>
  </body>
</html>
