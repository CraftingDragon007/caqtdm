services:
  nginx:
    image: caqtdm-web/nginx
    build:
      context: ../
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    networks:
      - caqtdm-web
    environment:
      - PROXY_BACKEND=http://caqtdm
      - BASIC_AUTH_USER=user
      - BASIC_AUTH_PASSWORD=password

  caqtdm:
    image: caqtdm-web/caqtdm
    build:
      context: ../../
      dockerfile: caQtDM_Web/docker/caqtdm/Dockerfile
    networks:
      - caqtdm-web

networks:
  caqtdm-web: {}
